name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 geodata_quality tests scripts --max-line-length=100 --extend-ignore=E203,W503
      - name: Formatage (black)
        run: black --check geodata_quality tests scripts
      - name: Tests (pytest)
        run: pytest tests/ -v
