name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publication d'une release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construction de l'archive du plugin
        run: bash scripts/build_plugin.sh

      - name: Création de la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
