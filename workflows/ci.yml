name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 geodata_quality tests scripts --max-line-length=100 --extend-ignore=E203,W503

      - name: Vérification du formatage (black)
        run: black --check geodata_quality tests scripts

      - name: Tests unitaires (pytest)
        run: pytest tests/ -v --cov=geodata_quality --cov-report=term-missing

  build-plugin:
    name: Build du plugin (ZIP)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construction de l'archive
        run: bash scripts/build_plugin.sh

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: geodata-quality-plugin
          path: dist/*.zip
